# ShipSense — full local stack. Start everything with:  docker compose up --build
# Services: PostgreSQL (seeded), Python ML service, Java API, React frontend.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shipsense}
      POSTGRES_USER: ${POSTGRES_USER:-shipsense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_local_only}
    ports:
      - "5432:5432"
    volumes:
      # Schema + seed run automatically on first initialisation (alphabetical order).
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shipsense} -d ${POSTGRES_DB:-shipsense}"]
      interval: 5s
      timeout: 3s
      retries: 15

  ml-service:
    build: ./ml-service
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build: ./backend-java
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-shipsense}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-shipsense}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-changeme_local_only}
      ML_SERVICE_URL: http://ml-service:8000
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        # The browser runs on the host, so it reaches the backend via localhost.
        VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
