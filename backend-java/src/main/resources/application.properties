spring.application.name=shipsense-backend
server.port=${SERVER_PORT:8080}

# ---- Datasource (PostgreSQL) ----
# Values come from .env / environment; sensible local defaults for dev.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shipsense}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:shipsense}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:changeme_local_only}

# ---- JPA / Hibernate ----
# The schema and seed data are managed by db/schema.sql + db/seed.sql (or
# docker-compose), NOT by Hibernate, so we only validate-free ('none').
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---- Python ML service ----
ml.service.url=${ML_SERVICE_URL:http://localhost:8000}

# ---- Frontend CORS ----
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ---- Actuator ----
management.endpoints.web.exposure.include=health,info

# ---- Swagger / OpenAPI ----
springdoc.swagger-ui.path=/swagger-ui.html
