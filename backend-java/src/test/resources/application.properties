# Test profile: H2 in-memory DB in PostgreSQL-compatibility mode.
# Hibernate creates the schema from the entities (create-drop) for each run.
spring.datasource.url=jdbc:h2:mem:shipsense;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# ML service URL is irrelevant in tests (the client is mocked); point it nowhere.
ml.service.url=http://localhost:9

management.endpoints.web.exposure.include=health,info
